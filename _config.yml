# Site settings
title: Ryan Lail
tagline: Notes on automated evaluation and AI safety
description: >-
  Paper writeups and research notes from Ryan Lail — Founding Engineer at
  Composo AI, working on automated evaluation (LLM-as-a-judge calibration,
  uncertainty quantification, classifier fine-tuning) and its connection to
  AI safety and scalable oversight.
author: Ryan Lail
github_username: ryanlail
twitter_username: ryan__lail
linkedin_username: ryanlail

# Build settings (custom theme — no theme gem)
markdown: kramdown
permalink: /:year/:month/:day/:title/

# kramdown / MathJax friendly
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Navigation shown in the header (page links; socials are added separately)
nav_pages: []

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .sass-cache
  - .jekyll-cache
